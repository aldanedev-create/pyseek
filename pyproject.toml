[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyseek"
version = "0.1.0"
description = "A small Neon-backed search engine demonstrating Teloce-Py and Flaxon"
requires-python = ">=3.11"
dependencies = ["flaxon", "teloce-py", "psycopg[binary]>=3.2", "beautifulsoup4>=4.12", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
